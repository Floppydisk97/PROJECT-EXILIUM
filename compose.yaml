name: project-exilium

x-backend: &backend
  build:
    context: ./backend
    target: runtime
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-exilium}:${POSTGRES_PASSWORD:?Copy .env.example to .env first}@db:5432/${POSTGRES_DB:-exilium}

services:
  db:
    image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exilium}
      POSTGRES_USER: ${POSTGRES_USER:-exilium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # Il browser di chi gioca raggiunge l'API su localhost, non sulla rete di compose.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-exilium}:${POSTGRES_PASSWORD:?Copy .env.example to .env first}@db:5432/${POSTGRES_DB:-exilium}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
