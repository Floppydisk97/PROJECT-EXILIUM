# Render Blueprint — deploy dell'intero stack di Project Exilium.
# Provisiona: PostgreSQL gestito, API FastAPI (autoritativa), worker del tick (always-on),
# frontend Next.js (globo). L'API applica le migrazioni e genera il pianeta 'Hesperia'
# alla prima partenza; la generazione è one-shot e la mappa è immutabile.
#
# Uso: su Render → New → Blueprint → connetti questo repo → scegli il branch che contiene
# questo file → Apply. Il piano free è per demo (il DB free scade dopo 30 giorni e i web
# service free vanno in sleep quando inattivi).

databases:
  - name: exilium-db
    plan: free
    databaseName: exilium
    user: exilium

services:
  # API autoritativa. Migra e genera la mappa all'avvio, poi serve FastAPI.
  - type: web
    runtime: python
    name: exilium-api
    plan: free
    rootDir: backend
    healthCheckPath: /health/live
    buildCommand: pip install -r requirements.lock.txt
    startCommand: >-
      alembic upgrade head &&
      (python -m app.mapcli || echo "map already generated; skipping") &&
      exec uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Il pianeta non si costruisce piu' dentro il comando di avvio.
      #
      # Generarlo sono minuti di CPU, e farlo prima di `exec uvicorn` tiene la porta chiusa
      # per tutto quel tempo. Render smette di aspettare un servizio che non apre nessuna
      # porta, e a 0,15 di core e' una scommessa che abbiamo perso: 13 s con un burst di
      # CPU, 6 minuti e mezzo senza, oltre 27 minuti al terzo tentativo.
      #
      # Con questa variabile mapcli si ferma subito, l'API apre la porta e costruisce il
      # mondo dopo, in un processo separato. Togliendola si torna esattamente a prima.
      - key: MAP_BUILD
        value: background
      - key: DATABASE_URL
        fromDatabase:
          name: exilium-db
          property: connectionString

  # Worker del tick (always-on): risolve i tick scaduti alle 00:00 UTC.
  # NB: su Render i worker richiedono un piano a pagamento (non free). Per attivarlo,
  # togli il commento e imposta un piano a pagamento (es. starter). Senza worker il
  # globo si vede lo stesso: la geografia è statica e l'economia semplicemente non avanza.
  # - type: worker
  #   runtime: python
  #   name: exilium-worker
  #   plan: starter
  #   rootDir: backend
  #   buildCommand: pip install -r requirements.lock.txt
  #   startCommand: python -m app.worker
  #   envVars:
  #     - key: PYTHON_VERSION
  #       value: "3.12.6"
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: exilium-db
  #         property: connectionString

  # Frontend Next.js: renderizza il globo. Chiama l'API server-side via API_INTERNAL_URL.
  - type: web
    runtime: node
    name: exilium-web
    plan: free
    rootDir: frontend
    healthCheckPath: /
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOSTNAME
        value: "0.0.0.0"
      # L'URL PUBBLICO, non quello di rete privata, e non e' una svista.
      #
      # Su piano free un'istanza inattiva viene spenta e si risveglia quando il router
      # pubblico di Render riceve una richiesta. Una chiamata sulla rete privata il router
      # non lo attraversa: l'API restava a dormire, il proxy riprovava per novanta secondi
      # senza svegliare nessuno, e il client mostrava "Server non raggiungibile". Misurato
      # dopo la prima notte vera: exilium-web sveglio in quattro secondi, exilium-api con
      # zero righe di log, cioe' mai partita.
      #
      # Non si vedeva prima perche' ogni verifica era stata fatta subito dopo un deploy,
      # con entrambi i servizi gia' svegli.
      #
      # Costo: la chiamata esce dalla rete privata e rientra dal router, quindi qualche
      # decina di millisecondi in piu' a mappa gia' generata. Da rimettere su `fromService`
      # il giorno in cui l'API passa a un piano che non dorme.
      - key: API_INTERNAL_URL
        value: https://exilium-api.onrender.com
