# Render Blueprint — deploy dell'intero stack di Project Exilium.
# Provisiona: PostgreSQL gestito, API FastAPI (autoritativa), worker del tick (always-on),
# frontend Next.js (globo). L'API applica le migrazioni e genera il pianeta 'Hesperia'
# alla prima partenza; la generazione è one-shot e la mappa è immutabile.
#
# Uso: su Render → New → Blueprint → connetti questo repo → scegli il branch che contiene
# questo file → Apply. Il piano free è per demo (il DB free scade dopo 30 giorni e i web
# service free vanno in sleep quando inattivi).

databases:
  - name: exilium-db
    plan: free
    databaseName: exilium
    user: exilium

services:
  # API autoritativa. Migra e genera la mappa all'avvio, poi serve FastAPI.
  # LA REGIONE NON E' UN DETTAGLIO, ed e' costata un servizio.
  #
  # Il primo servizio API stava a Frankfurt e il database a Oregon: l'indirizzo interno di un
  # database Render non attraversa le regioni, quindi non si sarebbero mai parlati -- e il
  # guasto non si presenta come "regione sbagliata", si presenta come un servizio che non
  # parte. Chi ricrea questi servizi li metta DOVE STA IL DATABASE.
  - type: web
    runtime: python
    name: exilium-api
    plan: free
    region: oregon
    rootDir: backend
    healthCheckPath: /health/live
    buildCommand: pip install -r requirements.lock.txt
    startCommand: >-
      alembic upgrade head &&
      (python -m app.mapcli || echo "map already generated; skipping") &&
      exec uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Il pianeta non si costruisce piu' dentro il comando di avvio.
      #
      # Generarlo sono minuti di CPU, e farlo prima di `exec uvicorn` tiene la porta chiusa
      # per tutto quel tempo. Render smette di aspettare un servizio che non apre nessuna
      # porta, e a 0,15 di core e' una scommessa che abbiamo perso: 13 s con un burst di
      # CPU, 6 minuti e mezzo senza, oltre 27 minuti al terzo tentativo.
      #
      # Con questa variabile mapcli si ferma subito, l'API apre la porta e costruisce il
      # mondo dopo, in un processo separato. Togliendola si torna esattamente a prima.
      - key: MAP_BUILD
        value: background
      # Quali pagine possono spendere un token. Il visore e' su un altro host, quindi la
      # schermata della citta' e' cross-origin PER PROGETTO -- ma il permesso si da' per nome:
      # il token viaggia in un header, non in un cookie, e un permesso aperto lascerebbe che
      # qualunque pagina di internet spenda un token di cui sia venuta in possesso.
      #
      # Le due variabili sono una COPPIA: questa dice al server quale sito puo' parlargli, e
      # NEXT_PUBLIC_API_URL piu' sotto dice al sito dove sta il server. Se una delle due non
      # corrisponde al servizio vero, la schermata della citta' smette di funzionare senza un
      # errore leggibile -- il browser rifiuta la risposta e basta.
      - key: ALLOWED_ORIGINS
        value: https://exilium-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: exilium-db
          property: connectionString

  # Worker del tick (always-on): risolve i tick scaduti alle 00:00 UTC.
  # NB: su Render i worker richiedono un piano a pagamento (non free). Per attivarlo,
  # togli il commento e imposta un piano a pagamento (es. starter). Senza worker il
  # globo si vede lo stesso: la geografia è statica e l'economia semplicemente non avanza.
  # - type: worker
  #   runtime: python
  #   name: exilium-worker
  #   plan: starter
  #   rootDir: backend
  #   buildCommand: pip install -r requirements.lock.txt
  #   startCommand: python -m app.worker
  #   envVars:
  #     - key: PYTHON_VERSION
  #       value: "3.12.6"
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: exilium-db
  #         property: connectionString

  # Il visore: un SITO STATICO, non un servizio.
  #
  # Il pianeta e' immutabile -- generato una volta, cambiato solo da una migrazione -- quindi
  # non e' mai stato una chiamata di rete per necessita'. Esserlo diventato ha messo
  # un'istanza free addormentata sul percorso critico del semplice guardare il mondo: una
  # giornata intera di 502, 429 e risvegli a freddo per consegnare quattro megabyte che non
  # cambiano mai. E un'istanza free che non si risveglia (difetto noto di Render) non la si
  # aggira con nessuna quantita' di pazienza nel client: l'abbiamo provato.
  #
  # Come asset statico non puo' essere irraggiungibile, non puo' essere lento a svegliarsi e
  # non consuma ore-istanza. E' anche la forma che serve al gioco scaricabile, che il mondo
  # se lo porta come dato invece di chiederlo alla rete.
  #
  # Il file viene scritto da `python -m app.mapexport` e versionato in frontend/public/map,
  # quindi la build qui e' solo npm: nessun database e nessun Python al momento del build.
  #
  # NB: un servizio web esistente non diventa un sito statico modificando questo file --
  # render.yaml descrive come una risorsa va creata e non tocca quelle che gia' esistono.
  - type: web
    runtime: static
    name: exilium-web
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Dove sta il server autoritativo. Cotto nel bundle, perche' un export statico non ha
      # un server a cui chiedere a runtime: cambiarlo e' una ricostruzione, ed e' giusto cosi'
      # -- l'indirizzo dell'autorita' non e' una cosa che debba potersi spostare da sola.
      # In sviluppo si scavalca dal campo "Server", nella pagina della colonia e nel menu.
      - key: NEXT_PUBLIC_API_URL
        value: https://exilium-api.onrender.com
