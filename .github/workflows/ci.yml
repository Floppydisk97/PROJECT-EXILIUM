name: Foundation checks

# Una volta sola per revisione, e i fork coperti lo stesso.
#
# `[push, pull_request]` faceva girare la stessa identica revisione DUE VOLTE per ogni ramo
# con una PR aperta: nella storia dei run ci sono le coppie con lo stesso SHA a un secondo di
# distanza (116/117, 125/126). Per una PR che nasce da un ramo di QUESTO repository il push
# copre gia' tutto.
#
# Ma da quando il repository e' pubblico le PR possono arrivare da un fork, e il push di un
# fork qui non ci arriva: senza l'evento `pull_request` un contributo esterno entrerebbe
# senza che nessuno lo abbia provato. Quindi ci sono tutti e due gli eventi, e ogni job
# scarta il caso doppio -- `pull_request` gira solo quando il ramo di partenza NON e' di
# questo repository. La guardia dice "tutto TRANNE una PR interna" e non "solo un push",
# cosi' un evento nuovo (l'avvio a mano qui sotto) non resta fuori per distrazione.
# E' scritta tre volte perche' GitHub non ha un `if` a livello di workflow; a tenerle uguali
# c'e' un test, non la memoria.
on:
  push:
    # Un cambio ai soli documenti non puo' rompere il codice, e questo progetto scrive molti
    # documenti. Se un giorno un test leggera' un file di docs, queste righe vanno tolte.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # A mano, dal bottone "Run workflow". Serve quando l'ultima revisione e' verde ma il giro
  # e' andato storto per una ragione che col codice non c'entra -- oggi: i runner che non
  # venivano assegnati. Senza, l'unico modo di riprovare era un commit finto.
  workflow_dispatch:

# E un push che ne supera un altro sullo stesso ramo annulla il primo: il risultato di una
# revisione gia' sorpassata non lo guarda nessuno, ma i minuti li paga lo stesso.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    services:
      postgres:
        image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: exilium_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/exilium_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.lock.txt
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    env:
      # Fissata, non "latest": il motore decide come vengono arrotondati i numeri in virgola
      # mobile, e questo job esiste per dire che tre lingue danno le STESSE celle. Un
      # aggiornamento silenzioso trasformerebbe una verifica in una scommessa.
      GODOT: "4.7.2-stable"
    steps:
      - uses: actions/checkout@v4
      # Il binario pesa 78 MB. Scaricarlo a ogni giro sarebbe un minuto buttato, e i minuti
      # di questo repository sono contati: la cache lo tiene fra un giro e l'altro.
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: ~/.godot-bin
          key: godot-${{ env.GODOT }}
      - if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.godot-bin
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/$GODOT/Godot_v${GODOT}_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d ~/.godot-bin
          chmod +x ~/.godot-bin/Godot_v${GODOT}_linux.x86_64
      # Senza finestra e senza editor. Il test confronta il gemello GDScript del generatore
      # con `frontend/app/colony/reference.json` -- lo STESSO riferimento che tiene il
      # gemello TypeScript -- cella per cella. Una cella di scarto e il giro e' rosso.
      - run: ~/.godot-bin/Godot_v${GODOT}_linux.x86_64 --headless --path client --script res://tests/run.gd

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - run: docker compose --profile test run --build --rm test
      - name: HTTP smoke test
        run: |
          curl --retry 30 --retry-delay 2 --retry-all-errors --fail http://localhost:8000/health/ready
          curl --retry 30 --retry-delay 2 --retry-all-errors --fail http://localhost:3000
      - name: Backup and verified restore round-trip
        run: |
          docker compose exec -T api python -m app.cli "CI City" >/dev/null
          bash scripts/backup.sh
          RESTORE_CONFIRM=yes bash scripts/restore.sh "$(ls -t backups/*.dump | head -1)"
          curl --retry 30 --retry-delay 2 --retry-all-errors --fail http://localhost:8000/health/ready
      # `--tail`, e corto. Vale PER SERVIZIO: con cinque servizi, quaranta righe l'uno fanno
      # duecento righe fra l'errore di pytest e la fine del log, e l'errore resta comunque
      # irraggiungibile -- e' successo, e sono stati due giorni di diagnosi al buio. Quindici
      # bastano a dire se un container e' morto, che e' tutto cio' che questo dump deve fare.
      - if: always()
        run: docker compose logs --tail 15 && docker compose down
