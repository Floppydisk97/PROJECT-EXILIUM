[pytest]
testpaths = tests
pythonpath = .
addopts = -ra -p no:cacheprovider
markers =
    repo: legge file che stanno nel REPOSITORY e non nel pacchetto backend.
        L'immagine di prova contiene solo `backend/`, quindi dentro al container questi
        non possono funzionare: li' vengono deselezionati. Il job `backend` li esegue.
