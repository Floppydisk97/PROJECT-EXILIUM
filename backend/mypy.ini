# Il controllo statico del backend.
#
# Esiste per una ragione con un nome: `colonyexport.py` chiamava `seed_for` con tre
# argomenti quando la firma ne prendeva due. E' rimasto cosi' per MESI, perche' nessuno
# lanciava quel comando e nessuno strumento guardava. Il frontend aveva `tsc --noEmit` in
# CI dal primo giorno; il backend non aveva niente.
#
# Provato: su quella riga, mypy dice "Too many arguments for seed_for".
#
# Deliberatamente NON in modalita' severa. Lo scopo non e' annotare tutto il progetto -- e'
# accorgersi quando due pezzi di codice smettono di essere d'accordo su una firma. Alzare
# l'asticella oltre quel che si puo' tenere pulito significa disattivarlo fra un mese.
[mypy]
python_version = 3.12
ignore_missing_imports = True
files = app

# Le migrazioni sono SQL con un guscio Python generato da alembic: non sono codice di
# questo progetto e annotarle non direbbe niente a nessuno.
[mypy-migrations.*]
ignore_errors = True
